name: Stale Management

on:
  schedule:
    - cron: "30 1 * * *" # Daily at 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - name: Process stale issues and pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 300
          days-before-close: 14
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity in the past 300 days. It will be closed in 14 days if no further
            activity occurs. If this issue is still relevant, please comment or provide
            additional information. Thank you for your contributions!
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity in the past 300 days. It will be closed in 14 days if no further
            activity occurs. Thank you for your contributions!
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,enhancement,blocked"
          exempt-pr-labels: "pinned,work-in-progress"
