site_name: python-json-logger
site_description: A python library adding json format output for python logging module
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
nav:
  - Home: index.md
  - Guide:
      - Quickstart: guide/quickstart.md
      - Customizing: guide/customizing.md
  - API Reference: api.md
