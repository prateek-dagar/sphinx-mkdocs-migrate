[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinx-mkdocs-migrate"
version = "0.1.0b1"
description = "Deterministic, evidence-driven analyzer and migration engine from MkDocs to Sphinx + MyST"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Prateek Dagar", email = "prateek0508dagar@gmail.com" }
]
keywords = [
    "sphinx",
    "mkdocs",
    "migration",
    "myst-parser",
    "documentation",
    "sphinx-design",
    "autodoc"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "click>=8.1",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "Sphinx>=7.0.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate"
Documentation = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate#readme"
Repository = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate.git"
Issues = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate/issues"
Changelog = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "furo>=2024.1.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=0.9.0",
]
docs = [
    "Sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2024.1.0",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
sphinx-migrate = "sphinx_mkdocs_migrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_mkdocs_migrate"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/sphinx_mkdocs_migrate",
    "/README.md",
    "/MIGRATION_GUIDE.md",
    "/pyproject.toml",
    "/LICENSE",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scratch", "research", ".venv", "docs", "dist", "build"]
