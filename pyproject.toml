[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinx-mkdocs-migrate"
dynamic = ["version"]
description = "Deterministic, evidence-driven analyzer and migration engine from MkDocs to Sphinx + MyST"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Prateek Dagar", email = "prateek0508dagar@gmail.com" }
]
keywords = [
    "sphinx",
    "mkdocs",
    "migration",
    "migrate-mkdocs-to-sphinx",
    "mkdocs-to-sphinx",
    "sphinx-to-mkdocs",
    "material-for-mkdocs",
    "myst-parser",
    "documentation-converter",
    "docs-migration",
    "sphinx-design",
    "autodoc",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "click>=8.1",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "Sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "beautifulsoup4>=4.12.0",
    'tomli>=2.0.0; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate"
Documentation = "https://sphinx-mkdocs-migrate.readthedocs.io/en/latest/"
Repository = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate.git"
Issues = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate/issues"
Changelog = "https://github.com/prateek-dagar/sphinx-mkdocs-migrate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "furo>=2024.1.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=0.9.0",
    "sphinx-immaterial>=0.11.0",
]
dev = [
    "sphinx-mkdocs-migrate[test]",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
research = [
    "beautifulsoup4>=4.12.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-literate-nav>=0.6.0",
]
docs = [
    "Sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2024.1.0",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
sphinx-migrate = "sphinx_mkdocs_migrate.cli:main"

[tool.hatch.version]
path = "src/sphinx_mkdocs_migrate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_mkdocs_migrate"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/sphinx_mkdocs_migrate",
    "/README.md",
    "/MIGRATION_GUIDE.md",
    "/pyproject.toml",
    "/LICENSE",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
norecursedirs = ["scratch", "research", ".venv", "docs", "dist", "build"]

[tool.coverage.run]
branch = true
source = ["sphinx_mkdocs_migrate"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
extend-exclude = ["scratch", "research", "docs/_build", "tests/fixtures"]

[tool.ruff.lint]
# Keep the initial CI gate focused on invalid syntax and unused code. Formatting
# is repaired by pre-commit.ci; broader style modernization needs its own
# baseline-changing pull request rather than blocking every contributor now.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
